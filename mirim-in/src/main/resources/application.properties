# =========================================================
#  미림iN - application.properties
#  민감한 값은 환경변수로 주입합니다. (${변수명:기본값})
#  로컬: mirim-in/.env (견본은 .env.example), 배포: Railway Variables
# =========================================================

# 로컬 .env 파일을 읽는다. 파일이 없으면(Railway 등) 무시된다.
spring.config.import=optional:file:.env[.properties]

server.port=8080
spring.application.name=mirim-in
# Railway 프록시 뒤에서 https 주소를 올바르게 인식 (Google 로그인 redirect_uri)
server.forward-headers-strategy=framework
# Jackson 3 기본값은 요청 JSON에서 boolean 등 기본형 필드가 빠지면 오류. 빠지면 false/0으로 받는다
spring.jackson.deserialization.fail-on-null-for-primitives=false

# ===== DB (MySQL) =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mirim_in}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 개발용. 배포 시 validate 또는 none (+ Flyway)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# N+1 완화 (질문 목록 -> 답변/키워드 조회)
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# ===== Google OAuth =====
# Google Cloud Console 승인된 리디렉션 URI:
#   http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# ===== 메일 (학교 이메일 인증 코드 발송) =====
# Gmail 사용 시: Google 계정 2단계 인증 -> '앱 비밀번호' 발급해서 사용
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===== 파일 업로드 (프로필 이미지) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ===== (선택) Redis - build.gradle 주석 해제 후 사용 =====
#spring.data.redis.host=${REDIS_HOST:localhost}
#spring.data.redis.port=${REDIS_PORT:6379}

# =========================================================
#  커스텀 설정 (@ConfigurationProperties 또는 @Value 로 주입)
# =========================================================

# 프론트엔드 주소 (CORS 허용, OAuth 로그인 후 리다이렉트)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# JWT - secret은 32바이트 이상 랜덤 문자열 (Base64 권장)
app.jwt.secret=${JWT_SECRET}
# 30분 (ms)
app.jwt.access-token-expiration=1800000
# 14일 (ms)
app.jwt.refresh-token-expiration=1209600000

# 학교 구성원 인증
app.auth.school-email-domain=e-mirim.hs.kr
# 인증 코드 유효시간 5분 (초)
app.auth.email-code-expiration=300

# 관리자 계정 - 서버 시작 시 ADMIN_EMAIL 계정을 관리자로 만든다 (비어 있으면 건너뜀)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:관리자}

# Cloudinary
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}
app.cloudinary.folder=mirim-in/profile

# ===== Swagger (http://localhost:8080/swagger-ui.html) =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

# ===== 로그 =====
logging.level.com.mirim=debug
logging.level.org.hibernate.SQL=debug